# Uganda rainfall early-warning demo: PostGIS database (+ optional tools image).
#
#   docker compose up -d db              # database only (host has GDAL + Python)
#   docker compose --profile tools build # optional: image with ogr2ogr, raster2pgsql, Python stack
#   docker compose --profile tools run --rm tools make demo
#
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: ews-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:-ews}
      POSTGRES_USER: ${PGUSER:-ews}
      POSTGRES_PASSWORD: ${PGPASSWORD:-ews}
    ports:
      - "${PGPORT:-5433}:5432"
    volumes:
      - ews-pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=64MB
      - -c
      - log_min_duration_statement=2000
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  tools:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: docker/tools.Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${PGDATABASE:-ews}
      PGUSER: ${PGUSER:-ews}
      PGPASSWORD: ${PGPASSWORD:-ews}
      EWS_DATA_DIR: ${EWS_DATA_DIR:-data}
    working_dir: /work
    volumes:
      - .:/work
    ports:
      - "8501:8501"

volumes:
  ews-pgdata:
